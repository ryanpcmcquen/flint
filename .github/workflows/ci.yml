name: CI

on:
  push:
  pull_request:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Benchmark smoke test
        run: make benchmark BENCH_ARGS="--runs 1 --warmup 0"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
      - name: Build
        run: make CC=gcc
      - name: Test
        run: make test CC=gcc

  windows-nmake:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install LLVM
        shell: powershell
        run: choco install llvm --no-progress -y
      - name: Build with nmake
        shell: cmd
        run: |
          set PATH=C:\Program Files\LLVM\bin;%PATH%
          nmake
      - name: Test with nmake
        shell: cmd
        run: |
          set PATH=C:\Program Files\LLVM\bin;%PATH%
          nmake test
