name: Release binaries

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            binary: flint
          - os: ubuntu-latest
            name: linux-x86_64
            binary: flint
          - os: windows-latest
            name: windows-x86_64
            binary: flint.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make

      - name: Build Unix
        if: runner.os != 'Windows'
        run: make

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make CC='gcc -static'

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp flint "dist/flint-${{ github.ref_name }}-${{ matrix.name }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp flint.exe "dist/flint-${{ github.ref_name }}-${{ matrix.name }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > "flint-${GITHUB_REF_NAME}-SHA256SUMS.txt"

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "Flint $tag" --verify-tag --notes-from-tag
          gh release upload "$tag" dist/* --clobber
